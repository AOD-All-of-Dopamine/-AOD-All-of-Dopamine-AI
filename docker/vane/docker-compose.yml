services:
  vane:
    # Vane(구 Perplexica) v1.12.x: SearXNG 내장 단일 이미지.
    # 조작된 이미지 태그 대신 상류를 '고정 ref'(VANE_REF)로 빌드한다.
    # LLM 프로바이더 설정은 config.toml이 아니라 POST /api/providers(→ data 볼륨에 영속).
    build:
      context: "https://github.com/ItzCrazyKns/Vane.git#${VANE_REF}"
    container_name: aod-vane
    ports:
      - "3000:3000"
    volumes:
      - vane-data:/home/vane/data
      - vane-uploads:/home/vane/uploads
    restart: unless-stopped

volumes:
  vane-data:
  vane-uploads:
