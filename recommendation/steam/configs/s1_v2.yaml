experiment:
  id: "steam_s1_v2"
  seed: 42

data:
  input_path: "/home/jiho/projects/-AOD-All-of-Dopamine-back/steam_games.jsonl"
  min_description_chars: 30

representation:
  type: "short_description_genres"

anchor:
  candidate_count: 80
  final_count: 40
  indie_max_count: 30

retrieval:
  candidate_k: 100
  evaluation_k: 10

embedding:
  model_name: "Qwen/Qwen3-Embedding-0.6B"
  normalize: true
  query_instruction: >
    Given a Steam game, retrieve other Steam games
    that a player who likes this game would likely find relevant.

runtime:
  prefer_device: "cuda"
  gpu_batch_size: 8
  cpu_batch_size: 4
  benchmark_items: 500

tfidf:
  ngram_min: 1
  ngram_max: 2
  min_df: 2
  max_df: 0.98
  max_features: 120000

evaluation:
  relevance_positive_threshold: 2
  ndcg_gain: "linear"
  ndcg_k: 10
