experiment:
  id: "steam_s1_v2"
  seed: 42

data:
  input_path: "${AOD_BACK_ROOT}/steam_games.jsonl"
  min_description_chars: 30

representation:
  type: "short_description_genres"

anchor:
  candidate_count: 80
  final_count: 40
  indie_max_count: 30

retrieval:
  candidate_k: 100
  evaluation_k: 10

embedding:
  model_name: "Qwen/Qwen3-Embedding-0.6B"
  normalize: true
  query_instruction: >
    Given a Steam game, retrieve other Steam games
    that a player who likes this game would likely find relevant.

runtime:
  prefer_device: "cuda"
  gpu_batch_size: 8
  # 4 를 키우지 말 것. 실행 환경의 cgroup 메모리 한도가 4 GiB 이고
  # Qwen3-0.6B fp32 가중치만 ~2.4GB 라 배치 8 이상은 OOM 으로 죽는다
  # (free 가 보여주는 호스트 메모리 15GB 는 무의미하다 — /sys/fs/cgroup/memory.max 확인).
  cpu_batch_size: 4
  # Qwen3 기본 32768. semantic_text 는 최대 359토큰이라 512 로 충분하며,
  # 제한하지 않으면 배치 인코딩이 거대한 할당을 잡아 역시 OOM 으로 죽는다.
  max_seq_length: 512
  benchmark_items: 500

tfidf:
  ngram_min: 1
  ngram_max: 2
  min_df: 2
  max_df: 0.98
  max_features: 120000

evaluation:
  relevance_positive_threshold: 2
  # gain 함수는 src/metrics.py 단일 소스에서 이 값을 읽는다.
  # linear -> exponential 로 변경(2026-07): 0~3 척도에서 3점과 2점의 차이를 벌린다.
  ndcg_gain: "exponential"
  ndcg_k: 10
  # 비교 대상 실험 ID. 판정 데이터에 없으면 evaluate.py 가 실패한다(조용한 스킵 금지).
  baseline_experiment_id: "steam_s1_tfidf_v2"
  treatment_experiment_id: "steam_s1_qwen_v2"
  precision_gate: 0.70
