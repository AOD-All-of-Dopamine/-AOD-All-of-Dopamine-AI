experiment:
  id: "steam_p1_v1"
  seed: 42

aggregation:
  strategies: ["max", "mean", "top2_mean"]
  top_n: 300
  rec_boost: 0.03
  # D-37 신설 · D-38 확정. quality = clip(log10(1+리뷰수)/5, 0, 1) 을 곱 보정으로 더한다.
  # 52프로필 · 미채점 0 에서 k=50 0.4638 → 0.7692 · P@10 → 0.8923.
  # D-50(위) · D-51(아래) 에서 양방향 스윕 — **0.50 이 봉우리다. 더 건드리지 않는다.**
  #   0.10 0.6913 · 0.20 0.7660 · 0.30 0.8040 · 0.40 0.8260 · **0.50 0.8353** ·
  #   0.70 0.8320 · 1.00 0.8253 · 1.50 0.8113   (dev 30 · k=50 · 미채점 0 · tag_w=0.40)
  # tag_w 가 이 항을 대신하지 못한다: 0.10 으로 내리면 top-50 리뷰0 비율이 0.2% → 20.9%.
  quality_w: 0.50
  # D-49 신설·확정. tag_fit = max_i |후보태그 ∩ 시드_i태그| / |시드_i태그| 를 보정항에 더한다.
  # 꼬리에서 유사도가 평평해(20위 0.4886 → 50위 0.4834) 변별력이 사라지고 그 자리를
  # quality 항이 채워, 태그가 한 개만 걸친 유명작(Iron Harvest RTS·Mechs 리뷰 11,628 g=0)이
  # 올라오던 것을 가른다. 신호 실측 2,600쌍: 프로필 내부 상관 중앙 +0.390 · 부호일치 52/52.
  # dev 30: 전체 0.7927 → 0.8353 · 대상군 0.6836 → 0.7455 · ILS +0.008 (관문 (E) 통과)
  # val 22: 전체 0.7391 → 0.8027 · 대상군 0.6840 → 0.7627 · ILS +0.002
  tag_w: 0.40

profiles:
  n_coherent: 10
  n_multi_interest: 10
  split: [12, 8]

paths:
  profiles: "artifacts/p1/profiles.parquet"
  ranked_dir: "artifacts/p1/"
  export: "artifacts/p1/p1_export.xlsx"
