experiment:
  id: "webnovel_wn_v1"
  seed: 42

data:
  input_path: "${AOD_WEBNOVEL_DATA}/webnovels.jsonl"
  # 시놉시스 단독이 아니라 임베딩에 들어가는 텍스트(제목+장르+줄거리) 합산 길이 하한.
  # 줄거리는 대체로 두껍지만(실측 중앙값 482자) 카피 문구만 있는 꼬리 작품이 있어
  # 줄거리 단독으로 자르지 않는다. 자세한 근거는 data_loader.record_to_row.
  min_text_chars: 20

representation:
  # rep_v1 = 제목 + 장르 + 줄거리. 제목을 넣는 게 Steam 과 다른 점이다
  # (웹소설 제목은 그 자체가 로그라인이라 시놉시스가 짧을 때 주된 의미 신호가 된다).
  type: "title_genre_synopsis"

retrieval:
  candidate_k: 100
  evaluation_k: 10

embedding:
  model_name: "Qwen/Qwen3-Embedding-0.6B"
  normalize: true
  query_instruction: >
    Given a Korean web novel, retrieve other Korean web novels
    that a reader who likes this novel would likely find relevant.

runtime:
  prefer_device: "cuda"
  gpu_batch_size: 8
  # **Steam 값(4)을 그대로 쓰면 OOM 으로 죽는다.** 실측: cgroup 한도 4 GiB 에서
  # 배치 4 로 돌리다 9번 OOM kill(`/sys/fs/cgroup/memory.events`).
  # 원인은 시퀀스 길이다 — Steam 의 semantic_text 는 최대 359토큰인데 웹소설은
  # 최대 1,227자(p95 626 / p99 1,010)로 3~4배 길고, 어텐션 메모리는 길이의 제곱이라
  # 같은 배치에서 10배 가까이 더 먹는다. 조용히 SIGKILL 되므로 로그에 아무것도 안 남는다.
  cpu_batch_size: 2
  # 512자 초과가 8%뿐이라 캡은 512 로 유지한다(그 이상은 잘려도 손실이 작다).
  max_seq_length: 512
  # 코퍼스보다 크면 전량을 두 번 인코딩하게 된다(벤치 1회 + 본 1회). 작게 잡는다.
  benchmark_items: 32

ranking:
  # 인기도 부스트. 실험 재현성을 위해 낮은 값을 기본으로 두고,
  # 제품 경로(next_page)는 personalized_retrieve.REFRESH_POP_BOOST 를 쓴다.
  pop_boost: 0.03
  # 품질 하한. 관심 수는 연속값이라 임계가 필요하다.
  # dataset_profile.json 의 interest_count 분포를 보고 확정한다.
  min_interest_count: 100

postprocess:
  series_max: 1
  author_max: 2
  seed_interleave: true

evaluation:
  relevance_positive_threshold: 2
  ndcg_gain: "exponential"
  ndcg_k: 10
  precision_gate: 0.70
