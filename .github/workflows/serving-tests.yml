name: serving-tests

# 추천 서빙(recommendation/serving)만 대상. 아티팩트(임베딩·parquet)는 리포에 없으므로(gitignore)
# 아티팩트가 필요한 테스트(@pytest.mark.artifacts)는 여기서 돌리지 않는다 — 로컬 전용
# (scripts/dev.sh test -m artifacts). 이미지 빌드 잡은 빌드 가능성만 확인한다 — 푸시·배포는 없다
# (추천 호스트가 생긴 뒤 별도 워크플로, REC_TAB_DESIGN §8-6 "빌드·배포").
on:
  pull_request:
    paths:
      - "recommendation/serving/**"
      - "recommendation/schemas/**"
      - "recommendation/*/src/**"
      - "recommendation/crossdomain/mix.py"
      - "recommendation/.dockerignore"
      - ".github/workflows/serving-tests.yml"
  push:
    branches: [main]
    paths:
      - "recommendation/serving/**"
      - "recommendation/schemas/**"
      - "recommendation/*/src/**"
      - "recommendation/crossdomain/mix.py"
      - "recommendation/.dockerignore"
      - ".github/workflows/serving-tests.yml"

permissions:
  contents: read

# 같은 브랜치(대개 같은 PR)에 새 커밋이 오면 진행 중이던 실행을 취소한다 — 이미지 빌드 4장 +
# pytest 가 커밋마다 쌓이는 것을 막는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recommendation/serving/requirements/dev.txt

      - run: pip install -r recommendation/serving/requirements/dev.txt

      # PyArrow 25 의 기본 메모리 풀(mimalloc)은 Arrow 를 쓰던 스레드가 종료한 뒤 그 TLS 블록을
      # 재활용한 새 스레드가 Arrow 할당을 하면 SIGSEGV 를 낸다(aod_serving/native.py 참고). 코드가
      # `aod_serving` import 시점에 이미 잡아 두고(tests/conftest.py 가 pyarrow 보다 먼저
      # `import aod_serving` 한다) Dockerfile ENV 로도 받치지만, 여기서는 컨테이너 밖이라 그 ENV 가
      # 없다 — CI 에서도 같은 값을 잡아 둔다(belt and braces).
      - name: pytest (아티팩트 없이 도는 테스트만 — artifacts 마커 제외)
        working-directory: recommendation/serving
        env:
          PYTHONPATH: ${{ github.workspace }}/recommendation/serving
          AOD_REC_ROOT: ${{ github.workspace }}/recommendation
          PYTHONDONTWRITEBYTECODE: "1"
          ARROW_DEFAULT_MEMORY_POOL: system
        # 아티팩트가 필요한 테스트는 어차피 건너뛰지만(로컬에 아티팩트가 없으면 skip), -m 으로 아예
        # 빼는 쪽이 더 빠르고 의도가 분명하다.
        run: pytest -q -p no:cacheprovider -m "not artifacts"

  images:
    name: build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [steam, tmdb, webtoon, webnovel, router]
    steps:
      - uses: actions/checkout@v4

      # Dockerfile 은 하나 + 빌드 인자 PLATFORM (REC_TAB_DESIGN §8-6). 빌드 컨텍스트는
      # recommendation/ — 엔진 타깃은 코드만 담고(아티팩트는 이미지 밖, 런타임에 볼륨 마운트),
      # 라우터 타깃은 numpy·pandas 를 아예 설치하지 않는다(mix.py 파일 하나만 복사).
      - name: build 과 스모크 임포트
        working-directory: recommendation
        run: |
          if [ "${{ matrix.platform }}" = router ]; then
            docker build -f serving/Dockerfile --target router -t aod-rec-router:ci .
            docker run --rm aod-rec-router:ci python -c "import sys, aod_serving.router.app; assert not {'numpy','pandas','pyarrow'} & set(sys.modules)"
          else
            docker build -f serving/Dockerfile --target engine --build-arg PLATFORM=${{ matrix.platform }} -t aod-rec-engine:ci .
            # `import aod_serving.engine.app` 만으로는 Dockerfile 의 플랫폼별 COPY(${PLATFORM}/src)가
            # 이미지 안에 실제로 들어갔는지 확인하지 못한다 — enter_platform 으로 그 플랫폼에 진입해
            # `src.config`·`src.personalized_retrieve` 를 직접 불러 본다. 두 모듈 다 모듈 최상위에서
            # 아티팩트(임베딩·parquet)를 읽지 않는다(경로 상수만 만든다·무거운 생성자는 함수 안) —
            # 그래서 /artifacts 마운트 없이 CI 에서 돈다. 네 플랫폼 전부 확인됨(config.py·
            # personalized_retrieve.py·postprocess.py·personalization/* 어디에도 모듈 최상위 파일 I/O 없음).
            docker run --rm aod-rec-engine:ci python -c "from aod_serving.engine.bootstrap import enter_platform; enter_platform('${{ matrix.platform }}'); import src.config, src.personalized_retrieve"
          fi
